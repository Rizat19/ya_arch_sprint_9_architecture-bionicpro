# Запуск с Linux настройками

services:
  clickhouse:
    # Добавляем контейнер инициализации, который запускается перед clickhouse
    init: true
    depends_on:
      - clickhouse-init
    
  # Инициализация сервиса для директории данных clickhouse
  clickhouse-init:
    image: alpine:latest
    command: |
      sh -c '
        echo "Initializing ClickHouse data directory..."
        if [ ! -d "/var/lib/clickhouse" ]; then
          mkdir -p /var/lib/clickhouse
        fi
        chown -R 101:101 /var/lib/clickhouse
        chmod -R 755 /var/lib/clickhouse
        echo "ClickHouse data directory initialized successfully"
      '
    volumes:
      - ./clickhouse-data:/var/lib/clickhouse
    user: root
    restart: "no"
